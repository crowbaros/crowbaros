# CrowbarOS mpv defaults: native Wayland, PipeWire audio, and quiet Nullkeel OSD.
vo=gpu-next,gpu,wlshm
gpu-context=wayland
ao=pipewire,pulse,alsa
keep-open=yes
osd-font=Manrope
osd-font-size=28
osd-color='#FFD8E5EC'
osd-border-color='#FF080D12'
osd-border-size=1.5
osd-bar-align-y=0.92
osd-bar-h=1.5
osd-bar-w=60
