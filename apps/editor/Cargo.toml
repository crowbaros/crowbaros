[package]
name = "crowbaros-editor"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
libc = "=0.2.189"
tempfile = "3"
serde_json = "1"
gpui-component-assets = "=0.5.1"
gpui = { version = "=0.2.2", default-features = false, features = ["wayland"] }
gpui-component = { version = "=0.5.1", features = ["tree-sitter-languages"] }
crowbar-ui = { path = "../../libs/crowbar-ui" }

[patch.crates-io]
gpui = { path = "../shell/gpui-source" }

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[profile.release]
opt-level = 2
debug = 0
lto = false
codegen-units = 16
