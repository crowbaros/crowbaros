[package]
name = "crowbaros-studio-settings"
version = "0.1.3"
edition = "2024"
license = "MIT"
publish = false
description = "CrowbarOS Studio Settings — appearance and reduced motion"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["wayland"] }
crowbar-theme = { path = "../../libs/crowbar-theme" }
crowbar-ui = { path = "../../libs/crowbar-ui" }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api"] }
zvariant = "5"
# GPUI 0.2.2 -> zed-async-tar -> xattr 0.2.3 references ENOATTR, removed in
# libc 0.2.190. This pins Rust FFI bindings, not Fedora's system glibc.
libc = "=0.2.189"

[profile.release]
opt-level = 2
debug = 0
lto = false
codegen-units = 16

# The shell's GPUI 0.2.2, with its patches: among them, a still window
# commits nothing. apps/shell/packaging/prepare-gpui.py makes it.
[patch.crates-io]
gpui = { path = "../shell/gpui-source" }
