[package]
name = "crowbaros-shell"
version = "0.1.1"
edition = "2024"
license = "MIT"
publish = false
description = "CrowbarOS desktop bar, dock and application launcher"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["wayland"] }
anyhow = "1"
chrono = "0.4"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
libc = "=0.2.189"

[patch.crates-io]
gpui = { path = "gpui-source" }

[profile.release]
opt-level = 2
debug = 0
lto = false
codegen-units = 16
