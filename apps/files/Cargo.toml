[package]
name = "crowbaros-files"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "CrowbarOS Files — quiet, keyboard-first file manager"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["wayland"] }
chrono = "0.4"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
# GPUI 0.2.2 -> zed-async-tar -> xattr 0.2.3 references ENOATTR, removed in
# libc 0.2.190.
libc = "=0.2.189"

[profile.release]
opt-level = 2
debug = 0
lto = false
codegen-units = 16

# The shell's GPUI 0.2.2, with its patches: among them, a still window
# commits nothing. apps/shell/packaging/prepare-gpui.py makes it.
[patch.crates-io]
gpui = { path = "../shell/gpui-source" }
