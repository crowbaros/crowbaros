[workspace]
resolver = "3"
members = ["probe"]
# Plain `cargo build`, `cargo test`, and `cargo clippy` cover both.
default-members = [".", "probe"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[package]
name = "crowbar-compositor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The CrowbarOS Wayland compositor, on Smithay. Part of Base."

[lib]
name = "crowbar_compositor"

[[bin]]
name = "crowbar-compositor"
path = "src/main.rs"

[features]
# The backend that draws into a window on a host session, for development and
# for `checks/nested.sh`. It is off by default, and Base never builds it: on
# an X11 session it makes its window with X11 client code, and the compositor
# holds no X11 code (ADR 0020). It opens no socket and no other way in.
nested = ["smithay/backend_winit"]

[dependencies]
rustix = { version = "1", features = ["net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }

# Smithay has no usable release. Pin a commit of master and bump it on purpose
# (ADR 0020). `default-features = false` leaves out `backend_libei` (input
# emulation), `xwayland`, `backend_x11`, and `backend_vulkan`. `tests/linked.rs`
# fails if the binary gains any of the first three, or any X11 client code.
[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "fd8e3f50f9556aa6c0485989d1d49ff2c5eefae1"
default-features = false
features = [
    "backend_udev",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
]

# The connector scanner from the Smithay repository, at the same commit.
# Without its default feature, which needs libdisplay-info for monitor names.
[dependencies.smithay-drm-extras]
git = "https://github.com/Smithay/smithay.git"
rev = "fd8e3f50f9556aa6c0485989d1d49ff2c5eefae1"
default-features = false

[dev-dependencies]
crowbar-probe = { path = "probe" }
# Reads the built binary's symbols, for the guard on what is linked.
object = { version = "0.39", default-features = false, features = ["read_core", "elf", "std"] }
rustc-demangle = "0.1"
rustix = { version = "1", features = ["fs", "net", "process"] }

# The tests draw with Smithay's renderer that needs no display.
[dev-dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "fd8e3f50f9556aa6c0485989d1d49ff2c5eefae1"
default-features = false
features = ["renderer_test"]

[profile.release]
opt-level = 2
debug = 0
