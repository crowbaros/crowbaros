[workspace]
resolver = "3"
members = ["crates/crowbar-state", "crates/crowbar-apply"]
# The GPUI apps pin their own dependency graphs and are built on their own.
exclude = ["apps"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
crowbar-state = { path = "crates/crowbar-state" }

[profile.release]
opt-level = "s"
lto = true
strip = true
