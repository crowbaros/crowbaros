[workspace]
resolver = "3"
members = ["crates/*"]
# The GPUI apps, the compositor, and the compositor spike pin their own
# dependency graphs and are built on their own.
exclude = ["apps", "compositor", "lab/compositor-spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.11"
libc = "0.2"
crowbar-state = { path = "crates/crowbar-state" }
crowbar-labels = { path = "crates/crowbar-labels" }
crowbar-broker = { path = "crates/crowbar-broker" }
crowbar-capability = { path = "crates/crowbar-capability" }
crowbar-gate = { path = "crates/crowbar-gate" }
crowbar-authority = { path = "crates/crowbar-authority" }

[profile.release]
opt-level = "s"
lto = true
strip = true
