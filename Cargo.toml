[workspace]
resolver = "3"
members = ["wire", "codegen", "probe", "sys"]
# Plain `cargo build`, `cargo test`, and `cargo clippy` cover every crate.
default-members = [".", "wire", "codegen", "probe", "sys"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# System calls, sockets, and descriptor passing, with no `unsafe` of ours.
# Not from the Smithay organization.
rustix = { version = "1", default-features = false, features = ["std"] }

[package]
name = "crowbar-compositor"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The CrowbarOS Wayland compositor, written from the ground up. Part of Base."

[lib]
name = "crowbar_compositor"

[[bin]]
name = "crowbar-compositor"
path = "src/main.rs"

[dependencies]
fulcrum-wire = { path = "wire" }
fulcrum-sys = { path = "sys" }
rustix = { workspace = true, features = ["event", "fs", "net"] }

[dev-dependencies]
crowbar-probe = { path = "probe" }
rustix = { workspace = true, features = ["event", "fs", "net", "pipe", "process"] }

[profile.release]
opt-level = 2
debug = 0
