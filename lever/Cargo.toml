[package]
name = "crowbar-lever"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Lever, the CrowbarOS service that drives the person's harnesses. Part of Base."

[workspace]
exclude = ["client"]

[[bin]]
name = "crowbar-lever"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
