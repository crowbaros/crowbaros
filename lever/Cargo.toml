[package]
name = "crowbar-lever"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Lever, the CrowbarOS service that drives the person's harnesses. Part of Base."

[workspace]
members = [".", "client"]
default-members = [".", "client"]

[[bin]]
name = "crowbar-lever"
path = "src/main.rs"

[[bin]]
name = "crowbar-stub-harness"
path = "src/bin/stub_harness.rs"

[dependencies]
agent-client-protocol-schema = { version = "=1.22.0", default-features = false }
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
