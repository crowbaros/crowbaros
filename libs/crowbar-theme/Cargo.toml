[package]
name = "crowbar-theme"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "CrowbarOS native theming model, palette tokens, WCAG contrast helpers, theme store, and per-app config renderers"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
images = ["dep:image", "dep:libc"]

[dependencies.image]
version = "=0.25.10"
optional = true
default-features = false
features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"]

[dependencies.libc]
version = "0.2"
optional = true
