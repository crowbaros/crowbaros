# CrowbarOS Nullkeel terminal defaults for foot.
font=IBM Plex Mono:size=10.5
pad=14x12 center
initial-color-theme=dark

[csd]
preferred=none

[colors-dark]
background=080d12
foreground=d8e5ec
cursor=080d12 49d7e8
selection-background=263b48
selection-foreground=d8e5ec
urls=49d7e8
jump-labels=080d12 49d7e8
search-box-match=080d12 49d7e8
search-box-no-match=080d12 e06c75

# Normal/regular colors (ANSI 0-7)
regular0=364957
regular1=e06c75
regular2=7cc9a6
regular3=e0be7a
regular4=62a8d4
regular5=b794cc
regular6=49d7e8
regular7=a8bac7

# Bright colors (ANSI 8-15)
bright0=6d8191
bright1=ee8c94
bright2=9be0c0
bright3=f0d49a
bright4=84c4ec
bright5=cfaee2
bright6=7ae5f2
bright7=d8e5ec
