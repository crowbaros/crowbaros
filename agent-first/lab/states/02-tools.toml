# A good change: two packages and a message of the day.
version = 1

[system]
hostname = "crowbar-lab"

[packages]
install = ["jq", "htop"]

[services]
enabled = ["agetty-tty1", "agetty-ttyS0", "dhcpcd", "sshd", "udevd"]

[[file]]
path = "/etc/motd"
content = """
CrowbarOS lab. This system is built from /etc/crowbar/state.toml.
Change it with `crowbar apply`, not by hand.
"""
