name: CI

# Every pull request and every push to main runs this workflow, so "CI passed"
# is always reported: it is the one check main's ruleset requires (ADR 0033).
# It also runs on main as each week starts, with every job: that run installs
# the week's Void root and saves it, so the week's first pull requests restore
# it, and it shows what a week of Void's updates did to main.
# A required check that a path filter skips would leave a pull request
# waiting on it forever, so the filtering happens in the `changes` job
# instead, and each job runs only when the change needs it. A change to docs
# alone runs `changes` and the gate, and nothing else.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monday, just after the week the Void root's cache key names begins (UTC).
    - cron: "7 0 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      compositor: ${{ steps.classify.outputs.compositor }}
      boot: ${{ steps.classify.outputs.boot }}
      agent: ${{ steps.classify.outputs.agent }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Docs are any Markdown file, docs/, compositor/docs/, .impeccable/, and
      # LICENSE. Everything else is code. The boot check covers what goes into
      # Base's image: base/, the compositor, the shell and Studio Settings, and
      # the Harness in agent/. The Harness's job covers agent/, and the two
      # files of Base it runs with: config.json pins its Node.js, and
      # void_base.py is the command the job runs.
      # A moved file counts at both its paths (`--no-renames`): Git names a
      # move by where the file went, and code moved into docs/ is still a
      # change to the code. Each path is read as it is, ended by a NUL
      # (`-z`): on a line of its own, Git puts a name with a quote, a
      # backslash, or a letter outside ASCII in quotes, which no pattern
      # here starts with. test_ci.py runs this script.
      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A path is bytes, and need not be text in any encoding: read and
          # matched a byte at a time, none can be taken with the NUL after it.
          export LC_ALL=C
          files=$(mktemp)
          if [ "$EVENT" = pull_request ]; then
            git diff -z --name-only --no-renames "$PR_BASE...$PR_HEAD" > "$files"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff -z --name-only --no-renames "$BEFORE" "$AFTER" > "$files"
          else
            git ls-files -z > "$files"
          fi
          code=false compositor=false boot=false agent=false
          while IFS= read -r -d '' f; do
            case "$f" in
              *.md|docs/*|compositor/docs/*|.impeccable/*|LICENSE) continue ;;
            esac
            # For the log, with every character but letters, digits, and
            # `._/-` shown as `?`: the runner reads `::` at the start of a
            # line and `##[` anywhere in one as a command, and a name may
            # hold either, and a newline before it.
            printf 'code: %s\n' "${f//[^A-Za-z0-9._\/-]/?}"
            code=true
            case "$f" in
              compositor/*|.github/workflows/compositor.yml) compositor=true ;;
            esac
            case "$f" in
              base/*|compositor/*|apps/shell/*|apps/files/*|apps/studio-settings/*|agent/*|.github/workflows/ci.yml) boot=true ;;
            esac
            case "$f" in
              agent/*|base/config.json|base/void_base.py|.github/workflows/ci.yml) agent=true ;;
            esac
          done < "$files"
          printf 'code=%s\ncompositor=%s\nboot=%s\nagent=%s\n' "$code" "$compositor" "$boot" "$agent" | tee -a "$GITHUB_OUTPUT"

  check:
    name: Lab scripts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lab scripts compile and pass their tests
        run: |
          python3 -m py_compile base/*.py lab/void/*.py .github/workflows/*.py apps/shell/packaging/*.py
          python3 -m unittest discover -s base -p "test_*.py"
          python3 -m unittest discover -s lab/void -p "test_*.py"
          python3 -m unittest discover -s .github/workflows -p "test_*.py"
          python3 -m unittest discover -s apps/shell/packaging -p "test_*.py"

  shell:
    name: Interface (${{ matrix.project }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        project: [apps/shell, apps/files, apps/studio-settings]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # What GPUI links. It links libxkbcommon-x11 even though the shell only
      # runs on Wayland. The tests open no window.
      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config patch \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig-dev libfreetype-dev

      # Rebuilds the patched GPUI source from the pinned crate and checks its
      # checksum. Both apps build with it. See apps/shell/README.md.
      - name: Prepare GPUI
        working-directory: apps/shell
        run: python3 packaging/prepare-gpui.py

      - name: Test
        run: cargo test --locked

  # Base's desktop helpers: the unlock helper, the launcher, the shell's
  # connection, and Ctrl+Alt+Del. Their tests serve real sockets and hash
  # with libcrypt, which the runner has.
  helpers:
    name: Desktop helpers
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: base/helpers
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Test
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  # The Harness (ADR 0034), by the command Base's build runs: type-checked,
  # tested, and bundled into one file, with the Node.js Base pins, checked by
  # its SHA-256, and the npm that came with it. Its tests start the bundle as
  # one process and talk to it over a real socket. The same command then
  # tests `crowbar-agent`, the terminal's client in agent/client, against
  # that bundle and the stub Model, with the runner's Rust.
  agent:
    name: Harness
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: The terminal's client is formatted and has no warnings
        working-directory: agent/client
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Check, test, and bundle the Harness, and test the terminal's client against it
        run: python3 base/void_base.py agent

  # The compositor's own workflow (ADR 0031), run when its code changes.
  compositor:
    name: Compositor
    needs: changes
    if: needs.changes.outputs.compositor == 'true'
    uses: ./.github/workflows/compositor.yml

  # Base's boot check, the same command a person runs: build Base and its
  # desktop, boot the image under UEFI with KVM, check it, and power it off.
  # GitHub's runners offer /dev/kvm, but GitHub does not support a VM inside
  # them (ADR 0033). The Void packages, the pinned Node.js, the crates, and
  # the desktop's Cargo build are cached from main, so a run reinstalls the
  # Void roots from the cached packages and rebuilds only what changed. The
  # Harness's packages come from npm on every run.
  boot:
    name: Base boots
    needs: changes
    if: needs.changes.outputs.boot == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Void roots, the build, the image, and the disk take about 25 GB,
      # and the runner has far more free, so nothing is deleted to make room.
      # Deleting the runner's unused toolchains took over two minutes.
      - name: Show the free space
        run: df -h / | tail -n 1

      # The host's Cargo only fetches the crates; Void's own Rust builds them.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install the host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends uidmap btrfs-progs dosfstools fdisk \
            qemu-system-x86 ovmf openssh-client patch

      # What README.md asks of a host: user namespaces (Ubuntu limits them
      # with AppArmor), subordinate IDs, /dev/kvm, and the firmware at the
      # paths config.json names, which are Arch's.
      - name: Let the check run as this user
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo chmod 0666 /dev/kvm
          for f in /etc/subuid /etc/subgid; do
            grep -q "^$USER:" "$f" || echo "$USER:100000:65536" | sudo tee -a "$f"
          done
          sudo mkdir -p /usr/share/edk2/x64
          sudo ln -sf /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/edk2/x64/OVMF_CODE.4m.fd
          sudo ln -sf /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/edk2/x64/OVMF_VARS.4m.fd

      # The build copies the Void root to make the image, and the boot copies
      # the image to make its disk: 3.5 GB each time. On Btrfs, where a
      # person's checkout usually is, `cp --reflink` shares the data and
      # copies nothing. The runner's disk is ext4, so the build's work
      # directory gets a Btrfs of its own, in a sparse file that takes only
      # the space written to it, and with `discard` gives back what is
      # deleted. It is mounted outside the checkout, with `.lab/base` a link
      # to it: the build binds the checkout into its Void build root from
      # inside a user namespace, which may not bind a directory that has a
      # mount of the runner's own under it. The link is made before anything
      # is restored into it.
      - name: Give the build a filesystem that copies by reference
        run: |
          sudo truncate -s 60G "$RUNNER_TEMP/lab.btrfs"
          sudo mkfs.btrfs -q "$RUNNER_TEMP/lab.btrfs"
          mkdir -p .lab "$RUNNER_TEMP/lab"
          sudo mount -o loop,noatime,discard "$RUNNER_TEMP/lab.btrfs" "$RUNNER_TEMP/lab"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/lab"
          ln -s "$RUNNER_TEMP/lab" .lab/base
          df -h / .lab/base/

      # The Void root takes about two and a half minutes to install, most of
      # it NVIDIA's DKMS build. Main saves the root it installed, keyed on
      # what decides the root and on the week, so a cached root is never more
      # than a week behind Void. `root key` names what decides it: the code
      # in void_base.py that installs, checks, and packs the root, what that
      # code reads from config.json, and rootfs.sh, and nothing else in
      # void_base.py, so a change to a boot check restores the same root.
      # Only that exact key is restored, never a root installed from
      # anything else. The digest is read on a line of its own, so a
      # `root key` that fails stops the job and names no root. void_base.py
      # packs and unpacks the root in its user namespace, so owners and
      # groups hold, and the build checks a restored root as it checks any
      # other.
      - name: Name the Void root
        id: name
        run: |
          digest=$(python3 base/void_base.py root key)
          echo "root=$digest-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the Void root
        id: root
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/crowbaros/root.tar.zst
          key: base-root-${{ steps.name.outputs.root }}

      - name: Unpack the Void root
        if: steps.root.outputs.cache-hit == 'true'
        run: python3 base/void_base.py root restore ~/.cache/crowbaros/root.tar.zst

      - name: Restore the Void packages
        id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/crowbaros/void
          key: base-packages-${{ hashFiles('base/config.json') }}
          restore-keys: base-packages-

      - name: Restore the desktop's build
        id: build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .lab/base/target
          key: base-build-${{ hashFiles('base/config.json', 'compositor/Cargo.lock', 'apps/shell/Cargo.lock', 'apps/files/Cargo.lock', 'apps/studio-settings/Cargo.lock', 'base/helpers/Cargo.lock', 'agent/client/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            base-build-${{ hashFiles('base/config.json', 'compositor/Cargo.lock', 'apps/shell/Cargo.lock', 'apps/files/Cargo.lock', 'apps/studio-settings/Cargo.lock', 'base/helpers/Cargo.lock', 'agent/client/Cargo.lock') }}-
            base-build-

      # Cargo rebuilds a crate whose files are newer than its last build, and
      # the checkout gives every file the time it was written, so the cached
      # build would all be built again. That build was made from the main
      # commit its key ends with. Every file but those that differ from that
      # commit gets one old time, and Cargo rebuilds only what changed. GPUI's
      # source is made from prepare-gpui.py and the patches, so it gets the
      # old time too unless either changed. With no build restored, or that
      # commit out of reach, every file keeps its new time and all of it
      # builds. The changed files are listed before any time is set, so a Git
      # that fails leaves nothing looking older than it is. test_ci.py runs
      # this script.
      - name: Give the files the cached build was made from an old time
        env:
          RESTORED: ${{ steps.build.outputs.cache-matched-key }}
        run: |
          built=${RESTORED##*-}
          if [ -z "$RESTORED" ] || ! git fetch -q --no-tags --depth=1 origin "$built"; then
            echo "No cached build to match, so the desktop builds from the start."
            exit 0
          fi
          export LC_ALL=C
          changed=$(mktemp)
          git diff -z --name-only --no-renames "$built" HEAD > "$changed"
          python3 apps/shell/packaging/prepare-gpui.py
          old=@946684800
          git ls-files -z | xargs -0 -r touch -h -c -d "$old" --
          if ! grep -qzE '^apps/shell/(packaging|patches)/' "$changed"; then
            find apps/shell/gpui-source -exec touch -h -d "$old" {} +
          fi
          xargs -0 -r touch -h -c -- < "$changed"
          echo "Files changed since $built: $(tr -cd '\0' < "$changed" | wc -c)"

      - name: Build, boot, and check Base
        run: python3 base/void_base.py check

      - name: Show the space the build took
        if: always()
        run: df -h / .lab/base/ || df -h /

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: base-boot-logs
          path: .lab/base/*.log
          include-hidden-files: true
          if-no-files-found: ignore

      # Only main saves, on a push or as the week starts, so every pull
      # request starts from main's build and the caches stay inside the
      # repository's 10 GB.
      - name: Save the Void packages
        if: github.event_name != 'pull_request' && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/crowbaros/void
          key: ${{ steps.packages.outputs.cache-primary-key }}

      # Saved only when the check passed, so a cached root is one Base booted
      # from.
      - name: Pack the Void root
        if: github.event_name != 'pull_request' && steps.root.outputs.cache-hit != 'true'
        run: python3 base/void_base.py root save ~/.cache/crowbaros/root.tar.zst

      - name: Save the Void root
        if: github.event_name != 'pull_request' && steps.root.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/crowbaros/root.tar.zst
          key: ${{ steps.root.outputs.cache-primary-key }}

      # The week's run may find the build of its own commit already saved.
      - name: Save the desktop's build
        if: github.event_name != 'pull_request' && steps.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .lab/base/target
          key: ${{ steps.build.outputs.cache-primary-key }}

  # Every boot on main saves the desktop's build under its own commit, about
  # 0.7 GB each time. Past 10 GB GitHub drops the caches used longest ago,
  # which may be the Void root or the packages. So main keeps its newest two
  # builds: two, for a pull request that is restoring one as the next is
  # saved. Two runs on main may delete the same build, and the one that
  # finds it gone goes on; a delete that fails for any other reason leaves
  # more builds than main keeps, which fails the job. Three may be left, as
  # another run may save one meanwhile. A job of its own, as no other job's token can
  # write, and it checks out and runs nothing from the repository.
  prune:
    name: Old builds
    needs: boot
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete main's builds that newer ones replace
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          old=$(gh cache list --ref refs/heads/main --key base-build- --sort created_at \
            --order desc --limit 100 --json id --jq '.[2:][].id')
          for id in $old; do
            gh cache delete "$id" || echo "Build $id was not deleted."
          done
          left=$(gh cache list --ref refs/heads/main --key base-build- --limit 100 --json id --jq length)
          echo "Builds main keeps: $left"
          [ "$left" -le 3 ]

  # The one required check. It passes when every job the change needed
  # passed, and a job the change did not need counts as passed.
  gate:
    name: CI passed
    if: always()
    needs: [changes, check, shell, helpers, agent, compositor, boot]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job the change needed passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
