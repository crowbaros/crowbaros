name: CI

# A change to docs alone starts no run: nothing here builds or tests them.
# A change that also touches any other path runs every job. Keep the two
# lists the same.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".impeccable/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".impeccable/**"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Lab scripts compile
        run: |
          python3 -m py_compile lab/void/*.py lab/void/guest/*.py
          python3 -m unittest discover -s lab/void -p "test_*.py"

  compositor:
    name: Compositor
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: compositor
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      # The libraries Smithay's TTY backend links. The tests need no display.
      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libseat-dev libinput-dev libudev-dev libxkbcommon-dev \
            libgbm-dev libdrm-dev libwayland-dev libegl1-mesa-dev

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  shell:
    name: Interface (${{ matrix.project }})
    strategy:
      matrix:
        project: [apps/shell, apps/studio-settings]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # What GPUI links. It links libxkbcommon-x11 even though the shell only
      # runs on Wayland. The tests open no window.
      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config patch \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig-dev libfreetype-dev

      # Rebuilds the patched GPUI source from the pinned crate and checks its
      # checksum. See apps/shell/README.md.
      - name: Prepare GPUI
        if: matrix.project == 'apps/shell'
        run: python3 packaging/prepare-gpui.py

      - name: Test
        run: cargo test --locked

