name: CI

# A change to docs alone starts no run: nothing here builds or tests them.
# A change that also touches any other path runs every job. Keep the two
# lists the same.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".impeccable/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".impeccable/**"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Lab scripts compile
        run: |
          python3 -m py_compile lab/void/*.py lab/void/guest/*.py lab/adversarial/*.py
          python3 -m unittest discover -s lab/void -p "test_*.py"

      # The Milestone 2 fixture services on loopback: no VM, stdlib only.
      - name: Adversarial fixtures smoke
        run: python3 lab/adversarial/adversarial_lab.py smoke

  warden:
    name: Warden
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Ubuntu lets a process that is not root make a user namespace only
      # with no capability inside it. One test gives a compartment the need
      # for user namespaces, as stock Linux has them.
      - name: Allow user namespaces as stock Linux does
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # The Warden runs as root (ADR 0016). The tests that start real
      # compartments are ignored without it, so Cargo builds them as the
      # runner's user and runs them under sudo.
      - name: Compartment tests, as root
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
        run: cargo test --locked -p crowbar-sandbox --test compartments -- --ignored

  # The compositor, and the spike that the Alpha desktop still runs (ADR 0020).
  compositor:
    name: Compositor (${{ matrix.project }})
    strategy:
      matrix:
        project: [compositor, lab/compositor-spike]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      # The libraries Smithay's TTY backend links. The tests need no display.
      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libseat-dev libinput-dev libudev-dev libxkbcommon-dev \
            libgbm-dev libdrm-dev libwayland-dev libegl1-mesa-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # The backend for a window on a host session is left out of the
      # compositor by default, so nothing above builds it.
      - name: Lint the nested backend
        if: matrix.project == 'compositor'
        run: cargo clippy --all-targets --locked --features nested -- -D warnings

  shell:
    name: Interface (${{ matrix.project }})
    strategy:
      matrix:
        project: [apps/shell, apps/studio-settings]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # What GPUI links. It links libxkbcommon-x11 even though the shell only
      # runs on Wayland. The tests open no window.
      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config patch \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig-dev libfreetype-dev

      # Rebuilds the patched GPUI source from the pinned crate and checks its
      # checksum. See apps/shell/README.md.
      - name: Prepare GPUI
        if: matrix.project == 'apps/shell'
        run: python3 packaging/prepare-gpui.py

      - name: Test
        run: cargo test --locked

