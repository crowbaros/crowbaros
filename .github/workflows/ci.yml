name: CI

# Fulcrum links only the C libraries ADR 0028 allows, and installs each as
# the code that needs it lands.
# A change to docs alone starts no run. Keep the two lists the same.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compositor:
    name: Compositor
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      # libxkbcommon and libinput, which Fulcrum links (ADR 0028), and the
      # keymaps.
      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev xkb-data libinput-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      # Includes the check that the generated protocol code matches the XML,
      # and that no crate from the Smithay organization is in Cargo.lock.
      - name: Test
        run: cargo test --locked
