[package]
name = "crowbar-compositor"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Spike for issue 3: the CrowbarOS compositor on Smithay. Throwaway code."

[lib]
name = "crowbar_compositor"

[[bin]]
name = "crowbar-compositor"
path = "src/main.rs"

[[bin]]
name = "crowbar-probe"
path = "src/bin/crowbar-probe.rs"

[dependencies]
bitflags = "2.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
# The probe is an ordinary Wayland client. It shares no code with the server
# side beyond the protocol crates.
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
rustix = { version = "1", features = ["fs", "net", "pipe", "process"] }

# Smithay has no usable release. Pin a commit of master and bump it on purpose.
# `default-features = false` leaves out `backend_libei` (input emulation),
# `xwayland`, `backend_x11`, and `backend_vulkan`.
[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "fd8e3f50f9556aa6c0485989d1d49ff2c5eefae1"
default-features = false
features = [
    "backend_winit",
    "backend_udev",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
]

# The connector scanner from the Smithay repository, at the same commit.
# Without its default feature, which needs libdisplay-info for monitor names.
[dependencies.smithay-drm-extras]
git = "https://github.com/Smithay/smithay.git"
rev = "fd8e3f50f9556aa6c0485989d1d49ff2c5eefae1"
default-features = false

[profile.release]
opt-level = 2
debug = 0
