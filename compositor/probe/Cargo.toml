[package]
name = "crowbar-probe"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Wayland clients for testing the CrowbarOS compositor from outside, on fulcrum-wire's client side, and a stand-in for the Warden. Never part of Base."

[lib]
name = "crowbar_probe"

[[bin]]
name = "crowbar-probe"
path = "src/bin/crowbar-probe.rs"

[dependencies]
fulcrum-wire = { path = "../wire" }
rustix = { workspace = true, features = ["event", "fs", "pipe"] }
