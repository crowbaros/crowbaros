[package]
name = "crowbar-probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Wayland clients for testing the CrowbarOS compositor from outside: an ordinary client and a stand-in for the Warden. Never part of Base."

[lib]
name = "crowbar_probe"

[[bin]]
name = "crowbar-probe"
path = "src/bin/crowbar-probe.rs"

[dependencies]
# Client crates only, and nothing from Smithay: what the probe sees is what
# any Wayland client sees.
wayland-client = "0.31.14"
# `log` sends the client library's own messages to the `log` crate instead of
# to stderr. A refused bind is two of them, and the tests make thousands.
wayland-backend = { version = "0.3.17", features = ["log"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
rustix = { version = "1", features = ["fs", "pipe", "process"] }
