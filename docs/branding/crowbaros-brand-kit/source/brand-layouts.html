<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CrowbarOS brand layouts</title><style>
@font-face{font-family:Manrope;src:url('../fonts/Manrope-Variable.ttf');font-weight:200 800}*{box-sizing:border-box}body{margin:0;background:#080D12;color:#D8E5EC;font-family:Manrope,sans-serif}.canvas{position:relative;overflow:hidden;width:1800px;height:1200px}.brand{position:absolute;left:60px;top:60px;width:610px}.tagline{position:absolute;left:75px;top:213px;font-size:43px;font-weight:500;letter-spacing:-.025em;line-height:1.25;margin:0}.crow{position:absolute;left:35px;top:360px;height:780px}.desktop-shot{position:absolute;left:710px;top:100px;width:1030px;outline:1px solid #364957}.caption{position:absolute;left:710px;top:700px;margin:0;font-size:22px;color:#A8BAC7}.swatches{position:absolute;left:710px;top:770px;display:flex;width:1030px;gap:12px}.swatch{width:196px;font-size:18px}.swatch div{height:102px;border-radius:12px;margin-bottom:14px}.swatch b{display:block;font-weight:650;margin-bottom:5px}.swatch span{color:#A8BAC7}.proof{position:absolute;top:1015px;left:710px;width:495px;height:120px;background:#17212B;border-radius:12px;display:grid;place-items:center}.proof img{width:370px}.proof.light{left:1245px;background:#D8E5EC}.edition{position:absolute;left:75px;bottom:30px;color:#A8BAC7;font-size:15px}.social{width:1200px;height:630px}.social .brand{left:56px;top:150px;width:630px}.social .tagline{left:67px;top:315px;font-size:38px}.social .crow{left:auto;right:20px;top:28px;height:580px}.social .edition{left:67px;bottom:62px;font-size:18px}.banner{width:1500px;height:500px}.banner .brand{left:75px;top:100px;width:680px}.banner .tagline{left:90px;top:268px;font-size:32px}.banner .crow{left:auto;right:110px;top:15px;height:470px}.banner .edition{display:none}.proofs{width:1200px;height:900px;display:grid;grid-template-columns:1fr 1fr}.proofs>div{position:relative;display:flex;align-items:center;justify-content:center;background:#080D12}.proofs>div:nth-child(2){background:#D8E5EC}.proofs>div:nth-child(3){background:#17212B}.proofs>div:nth-child(4){background:#FFFFFF}.proofs img{height:410px;max-width:80%;object-fit:contain}.proofs p{position:absolute;bottom:16px;left:24px;font-size:14px}.proofs>div:nth-child(even) p{color:#080D12}
</style></head><body><main class="canvas" id="canvas"></main><script>
const mode=new URLSearchParams(location.search).get('mode')||'overview';const c=document.getElementById('canvas');
if(mode==='proof'){c.className='proofs';c.innerHTML=['Void','Frost','Abyss','White'].map(x=>`<div><img src="../mascot/crow-master.png" alt="Crow cutout on ${x}"><p>${x} ground · transparency proof</p></div>`).join('');}
else{if(mode!=='overview')c.classList.add(mode);c.innerHTML=`<img class="brand" src="../logos/svg/crowbaros-horizontal-primary.svg" alt="CrowbarOS"><p class="tagline">Quiet surface.<br>Sharp mind.</p><img class="crow" src="../mascot/crow-master.png" alt="Engraved crow with cyan wing feather"><div class="edition">${mode==='overview'?'Brand kit 1.0 · November 2026':'A community-built Linux desktop.'}</div>`;if(mode==='overview')c.innerHTML+=`<img class="desktop-shot" src="../mockups/workspace-1600x900.png" alt="Workspace concept"><p class="caption">Dark by character. Clear by design.</p><div class="swatches">${[['Void','#080D12'],['Abyss','#17212B'],['Ice','#49D7E8'],['Steel','#6D8191'],['Frost','#D8E5EC']].map(([n,v])=>`<div class="swatch"><div style="background:${v};${n==='Void'?'outline:1px solid #364957':''}"></div><b>${n}</b><span>${v}</span></div>`).join('')}</div><div class="proof"><img src="../logos/svg/crowbaros-horizontal-frost.svg" alt="Monochrome light logo"></div><div class="proof light"><img src="../logos/svg/crowbaros-horizontal-dark.svg" alt="Monochrome dark logo"></div>`;}
</script></body></html>
